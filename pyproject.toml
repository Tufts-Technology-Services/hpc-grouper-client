[project]
name = "grouper-client"
version = "0.2.1"
description = "Python client for Grouper API used for HPC user management"
readme = "README.md"
authors = [
  {name = "Chris Barnett", email = "Christopher.Barnett@tufts.edu"},
]
requires-python = ">= 3.8"
dependencies = [
    "requests",
    "pyjwt",
    "cryptography",
    "pydantic"
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
